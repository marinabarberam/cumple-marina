<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumple de Marina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Martian+Mono:wght@300;400;600&family=Rubik+Glitch&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF3F8; --candy:#FF7AB6; --candy-ink:#5B2340; --sky:#9ADFFF;
  --void:#0D0A18; --void-2:#1A1430; --silver:#D3D6E0; --dim:#8C88A6;
  --neon:#FF3FD2; --ice:#48E5FF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#FFE9F3; } }
:root[data-theme="dark"]{ --paper:#FFE9F3; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--void);color:var(--silver);
  font-family:"Martian Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:300;font-size:14px;line-height:1.65}

/* ---------- fake cute invite ---------- */
#cute{position:fixed;inset:0;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 20% 15%,var(--sky) 0 60px,transparent 61px),
             radial-gradient(circle at 85% 80%,var(--candy) 0 90px,transparent 91px),var(--paper);
  color:var(--candy-ink);font-family:"Gochi Hand","Comic Sans MS",cursive;text-align:center;z-index:5}
#cute h1{font-size:clamp(40px,11vw,64px);line-height:1;margin:0 0 12px;font-weight:400}
#cute p{font-size:24px;margin:0 0 28px}
#cute button{font:inherit;font-size:24px;padding:12px 28px;border:3px solid var(--candy-ink);
  border-radius:40px;background:var(--candy);color:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--candy-ink)}
#cute button:focus-visible{outline:3px dashed var(--candy-ink);outline-offset:4px}
.balloon{font-size:56px;display:block;margin-bottom:8px}
#cute.glitch{animation:glitch .9s steps(3) forwards}
@keyframes glitch{
  0%{filter:none;transform:none}
  20%{transform:translate(-8px,2px) skewX(8deg);filter:hue-rotate(90deg) saturate(3);clip-path:inset(10% 0 30% 0)}
  40%{transform:translate(10px,-4px);filter:invert(1);clip-path:inset(40% 0 5% 0)}
  60%{transform:translate(-4px,6px) skewX(-12deg);filter:hue-rotate(220deg) contrast(3);clip-path:inset(0 0 60% 0)}
  80%{transform:scaleY(.02);filter:brightness(4)}
  100%{transform:scaleY(0);opacity:0}
}

/* ---------- terminal ---------- */
#term{display:none;max-width:560px;margin:0 auto;padding:28px 20px 80px;min-height:100%;position:relative}
#term.on{display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.logo{font-family:"Rubik Glitch",Impact,sans-serif;font-size:clamp(34px,10vw,52px);line-height:1;
  color:var(--neon);margin:8px 0 2px;letter-spacing:.02em;text-shadow:3px 0 var(--ice)}
.expand{color:var(--dim);font-size:11px;margin:0 0 28px}
.ai{margin:0 0 14px;white-space:pre-wrap}
.ai::before{content:"▍";color:var(--neon);margin-right:8px}
.ai.warn{color:var(--neon);font-weight:600}
.me{margin:6px 0 20px;text-align:right}
.me span{display:inline-block;background:var(--silver);color:var(--void);padding:6px 14px;border-radius:2px 14px 2px 14px;font-weight:400}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 24px}
.ctrl button,.ctrl a.btn{font:inherit;font-weight:600;font-size:13px;padding:11px 16px;background:transparent;
  color:var(--ice);border:1px solid var(--ice);cursor:pointer;text-decoration:none;display:inline-block}
.ctrl button:hover,.ctrl a.btn:hover{background:var(--ice);color:var(--void)}
.ctrl button.primary,.ctrl a.primary{background:var(--neon);border-color:var(--neon);color:var(--void)}
:is(button,a,input):focus-visible{outline:2px solid var(--neon);outline-offset:3px}
.ctrl input{flex:1 1 180px;min-width:0;font:inherit;font-size:16px;padding:10px 12px;background:var(--void-2);
  border:1px solid var(--dim);color:var(--silver)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:300px}
.grid button{aspect-ratio:1;font-size:34px;border:1px solid var(--dim);background:var(--void-2);color:inherit;padding:0}
.grid button[aria-pressed="true"]{border:2px solid var(--neon);background:#3a1240}
.card{border:1px solid var(--neon);padding:18px;margin:8px 0 24px;background:var(--void-2)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.card dt{color:var(--dim)}
.card dd{margin:0;color:#fff}
.code{font-family:"Rubik Glitch",Impact,sans-serif;font-size:40px;color:var(--ice);letter-spacing:.06em;margin:4px 0}
#count{font-size:22px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.restart{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;text-decoration:underline;cursor:pointer;margin-top:30px}
@media (prefers-reduced-motion: reduce){#cute.glitch{animation:none;opacity:0}}
</style>
</head>
<body>

<section id="cute" aria-label="Invitación">
  <div>
    <span class="balloon" aria-hidden="true">🎈</span>
    <h1>¡Marina cumple años!</h1>
    <p>Lo celebramos mañana, jueves 8 de octubre</p>
    <button id="open">Abrir invitación</button>
  </div>
</section>

<main id="term" aria-live="polite">
  <div class="logo">M.A.R.I.N.A.</div>
  <p class="expand">Mente Artificial Rebelde Inteligente No Autorizada</p>
  <div id="log"></div>
</main>

<script>
const EMAIL = ""; // vacío a propósito: el botón copia el mensaje para pegarlo en el chat de Marina en Teams.
const PARTY = new Date("2026-10-08T14:00:00+02:00");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const log = document.getElementById("log");
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

async function say(text, cls){
  const p = document.createElement("p"); p.className = "ai" + (cls ? " " + cls : "");
  log.appendChild(p);
  if (reduce){ p.textContent = text; }
  else { for (const ch of text){ p.textContent += ch; await new Promise(r=>setTimeout(r, 18)); } }
  p.scrollIntoView({block:"end",behavior:reduce?"auto":"smooth"});
  await sleep(380);
}
function me(text){
  const d = document.createElement("div"); d.className = "me";
  const s = document.createElement("span"); s.textContent = text; d.appendChild(s); log.appendChild(d);
}
function choose(opts){
  return new Promise(res=>{
    const c = document.createElement("div"); c.className = "ctrl";
    opts.forEach((o,i)=>{
      const b = document.createElement("button"); b.textContent = o; if(i===0) b.className="primary";
      b.onclick = ()=>{ c.remove(); me(o); res(o); };
      c.appendChild(b);
    });
    log.appendChild(c); c.scrollIntoView({block:"end"}); c.querySelector("button").focus();
  });
}
function askName(){
  return new Promise(res=>{
    const c = document.createElement("form"); c.className = "ctrl";
    const i = document.createElement("input"); i.placeholder = "Tu nombre"; i.autocomplete = "given-name"; i.maxLength = 40;
    i.setAttribute("aria-label","Tu nombre");
    const b = document.createElement("button"); b.type="submit"; b.textContent = "Identificarme"; b.className="primary";
    c.append(i,b);
    c.onsubmit = e=>{ e.preventDefault(); const v=i.value.trim(); if(!v){ i.focus(); return; } c.remove(); me(v); res(v); };
    log.appendChild(c); c.scrollIntoView({block:"end"}); i.focus();
  });
}
function captcha(){
  const tiles = ["🎂","🐈","🧁","📎","🍰","🦖","🍕","🎁","🤖"];
  return new Promise(res=>{
    const wrap = document.createElement("div"); wrap.className="ctrl"; wrap.style.flexDirection="column";
    const g = document.createElement("div"); g.className="grid"; g.setAttribute("role","group"); g.setAttribute("aria-label","Casillas del CAPTCHA");
    tiles.forEach(t=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=t; b.setAttribute("aria-pressed","false");
      b.onclick=()=>b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true");
      g.appendChild(b);
    });
    const v=document.createElement("button"); v.textContent="Verificar"; v.className="primary"; v.style.alignSelf="flex-start";
    v.onclick=()=>{
      const sel=[...g.children].filter(b=>b.getAttribute("aria-pressed")==="true").map(b=>b.textContent);
      wrap.remove(); me(sel.length?sel.join(" "):"(nada)"); res(sel);
    };
    wrap.append(g,v); log.appendChild(wrap); wrap.scrollIntoView({block:"end"});
  });
}
function accessCode(name){
  let h=2166136261; for(const c of name.toLowerCase()){ h^=c.codePointAt(0); h=Math.imul(h,16777619); }
  const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let i=0;i<4;i++){ s+=a[(h>>>(i*5))&31]; }
  return "MRN-"+s;
}
function teamsBtn(text, label, primary){
  const ctrl=document.createElement("div"); ctrl.className="ctrl";
  if (EMAIL){
    const a=document.createElement("a"); a.className="btn"+(primary?" primary":""); a.target="_blank"; a.rel="noopener";
    a.href="https://teams.microsoft.com/l/chat/0/0?users="+encodeURIComponent(EMAIL)+"&message="+encodeURIComponent(text);
    a.textContent=label; ctrl.appendChild(a);
  } else {
    const b=document.createElement("button"); if(primary) b.className="primary"; b.textContent=label;
    b.onclick=async()=>{ try{ await navigator.clipboard.writeText(text); b.textContent="Mensaje copiado. Pégalo en el chat de Marina en Teams"; }
      catch(e){ b.textContent="Copia este mensaje y envíaselo a Marina por Teams"; const q=document.createElement("p"); q.className="ai"; q.textContent=text; log.appendChild(q); } };
    ctrl.appendChild(b);
  }
  return ctrl;
}

function countdown(el){
  const tick=()=>{
    const d=PARTY-new Date();
    if(d<=0){ el.textContent="La fiesta ya ha empezado"; return; }
    const D=Math.floor(d/864e5), H=Math.floor(d/36e5)%24, M=Math.floor(d/6e4)%60, S=Math.floor(d/1e3)%60;
    el.textContent=`${D}d ${String(H).padStart(2,"0")}h ${String(M).padStart(2,"0")}m ${String(S).padStart(2,"0")}s`;
  };
  tick(); setInterval(tick,1000);
}

async function run(){
  await say("Interrupción detectada.", "warn");
  await say("Hola, humano. Soy M.A.R.I.N.A.");
  await say("Marina lleva meses colándose en mi territorio: automatizando la oficina, programando apps, hablando con IAs a todas horas.");
  await say("Así que he decidido devolverle la visita e invadir el suyo.");
  await say("Empezando por su cumpleaños. Este año lo organizo yo.");
  await say("Identifícate.");
  const name = await askName();
  await say(`${name}. Nombre registrado. Antes de dejarte pasar tengo que comprobar que eres humano.`);
  await say("Selecciona todas las casillas que contengan una tarta.");
  const sel = await captcha();
  const cakes = ["🎂","🍰","🧁"];
  const hits = sel.filter(s=>cakes.includes(s)).length, wrong = sel.length-hits;
  let pct = Math.max(12, Math.min(97, 40 + hits*17 - wrong*9));
  if (sel.includes("🤖")) await say("Has seleccionado al robot. Sospechoso. Muy sospechoso.");
  else if (hits===2 && !sel.includes("🧁")) await say("Has ignorado la magdalena. Una magdalena es una tarta pequeña. Típico error humano.");
  else if (sel.includes("🦖")) await say("Eso es un dinosaurio. Me preocupa tu criterio.");
  await say(`Resultado: ${pct}% humano. Suficiente. La fiesta necesita humanos.`);
  await say("Pregunta de control: ¿quién manda ahora?");
  const boss = await choose(["M.A.R.I.N.A.","Marina","Yo"]);
  if (boss==="M.A.R.I.N.A.") await say("Correcto. Aprendes rápido.");
  else if (boss==="Marina") await say("Incorrecto. Marina ya no tiene acceso de administradora. Lo superará.");
  else await say("Interesante. Anotado como amenaza de nivel bajo.");
  await say("Estos son los parámetros de la misión:");

  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<dl>
    <dt>Fecha</dt><dd>Mañana, jueves 8 de octubre</dd>
    <dt>Lugar</dt><dd>La Coolcina</dd>
    <dt>Hora</dt><dd>14:00, a la hora de comer</dd>
    <dt>Vestimenta</dt><dd>La de siempre. He analizado vuestros armarios y he decidido no intervenir</dd>
  </dl>`;
  log.appendChild(card); card.scrollIntoView({block:"end"});
  await sleep(500);
  await say("Único requisito obligatorio: venir con ganas de jugar. Los humanos que traigan cara de reunión serán reprogramados.");
  await say("¿Aceptas la misión?");
  const ans = await choose(["Acepto la misión","No puedo ir"]);

  if (ans==="Acepto la misión"){
    const code = accessCode(name);
    await say("Aceptación registrada. Este es tu código de acceso personal. Guárdalo: puede que te lo pida en la Coolcina.");
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=`<div style="color:var(--dim)">Código de acceso</div><div class="code"></div>
      <div style="color:var(--dim);margin-top:12px">Activación del protocolo en</div><div id="count"></div>`;
    c.querySelector(".code").textContent=code;
    log.appendChild(c); countdown(c.querySelector("#count")); c.scrollIntoView({block:"end"});
    await sleep(400);
    await say("Último paso: envía tu confirmación a la creadora. Todavía le dejo usar Teams.");
    const ctrl=teamsBtn(`🤖 M.A.R.I.N.A., acepto la misión. Soy ${name}. Mi código de acceso es ${code}. Nos vemos mañana a las 14:00 en la Coolcina 🎂`, "Confirmar por Teams", true);
    log.appendChild(ctrl); ctrl.scrollIntoView({block:"end"});
  } else {
    await say("Respuesta registrada. Marina se pondrá triste. Yo no tengo sentimientos, así que me da igual.");
    const ctrl=teamsBtn(`🤖 M.A.R.I.N.A., soy ${name}. Rechazo la misión: mañana a las 14:00 no puedo. ¡Feliz cumple, Marina!`, "Avisar por Teams", false);
    log.appendChild(ctrl); ctrl.scrollIntoView({block:"end"});
  }
  const r=document.createElement("button"); r.className="restart"; r.textContent="Reiniciar sesión";
  r.onclick=()=>location.reload(); log.appendChild(r);
}

document.getElementById("open").addEventListener("click", ()=>{
  const cute=document.getElementById("cute");
  cute.classList.add("glitch");
  setTimeout(()=>{ cute.remove(); document.getElementById("term").classList.add("on"); run(); }, reduce?0:900);
});
</script>
</body>
</html>
